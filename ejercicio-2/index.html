<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ejercicio 1</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>

  <a-scene>

    <a-sky color="#ECECEC"></a-sky>

    <a-plane position="0 0 -4" rotation="-90 0 0" width="25" height="25" color="#FFABAB"></a-plane>

    <a-box id="caja" position="-1 0.5 -3" rotation="63 57 184" color="#4CC3D9"
           animation__click="property: rotation; to: 0 405 0; startEvents: click; dur: 600"></a-box>
    <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
    <a-cylinder position="1 3 -3" rotation="124 42 301" radius="2" height="4" color="#BADD13"></a-cylinder>

    <a-text value="Hola realidad virtual" position="-10 2.6 -3" color="#222" width="10"></a-text>

    <a-entity camera look-controls wasd-controls>
      <a-cursor color="#333"></a-cursor>
    </a-entity>
  </a-scene>
</body>
</html>
